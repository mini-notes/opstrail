[project]
name = "opstrail"
version = "0.1.0"
description = "Alert intake, labelling and MS Teams notification for Alertmanager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",   # sync driver, used by alembic
    # 1.16 for `if_not_exists=` on create_index, used by the acknowledgement
    # migration. An older Alembic raises TypeError there rather than skipping.
    "alembic>=1.16",
    "jinja2>=3.1.6,<4",
    "httpx>=0.28",
    "apscheduler>=3.10,<4",
    # The zone severity_rules windows are read in comes from ZoneInfo, which
    # reads /usr/share/zoneinfo. python:3.13-slim happens to ship it today;
    # depending on that is a runtime failure deep inside rule evaluation the
    # day a slimmer base image does not. ~500KB to not care.
    "tzdata>=2024.2",
    # bcrypt directly, NOT passlib: passlib 1.7.4 (last released 2020) breaks
    # outright against bcrypt 5.x -- it reads bcrypt.__about__, which no longer
    # exists, then raises on every hash. See app/security.py.
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `x: T = Depends(...)` is the documented FastAPI idiom for dependencies.
    "B008",
    # `str, Enum` is deliberate: the members must compare equal to their wire
    # value for SQLAlchemy's values_callable and for JSON serialisation.
    "UP042",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]
