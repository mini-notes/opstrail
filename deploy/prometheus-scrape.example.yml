# Add to your internal Prometheus configuration. Do not route OpsTrail's own
# availability alerts exclusively through OpsTrail or the same Teams flow.
scrape_configs:
  - job_name: opstrail
    scrape_interval: 15s
    scrape_timeout: 8s
    scheme: https
    static_configs:
      - targets: ['opstrail.internal']
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/opstrail_metrics_token
rule_files:
  - /etc/prometheus/rules/opstrail-alerts.yml
