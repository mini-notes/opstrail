groups:
  - name: opstrail
    rules:
      - alert: OpsTrailScrapeMissing
        expr: up{job="opstrail"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'OpsTrail metrics unavailable'}
      - alert: OpsTrailWorkerMissing
        expr: time() - opstrail_worker_last_success_timestamp_seconds{component="dispatch"} > 60 or absent(opstrail_worker_last_success_timestamp_seconds{component="dispatch"})
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'OpsTrail dispatcher heartbeat missing'}
      - alert: OpsTrailMaintenanceMissing
        expr: time() - opstrail_worker_last_success_timestamp_seconds{component="maintenance"} > 180 or absent(opstrail_worker_last_success_timestamp_seconds{component="maintenance"})
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'OpsTrail maintenance has not completed'}
      - alert: OpsTrailBacklog
        expr: opstrail_pending_oldest_age_seconds > 120
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'OpsTrail notification backlog is growing'}
      - alert: OpsTrailDeliveryFailed
        expr: opstrail_deliveries{status="failed"} > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'OpsTrail has failed deliveries; inspect delivery history'}
      - alert: OpsTrailIntakeErrors
        expr: sum(rate(opstrail_intake_requests_total{status_class="5xx"}[5m])) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'OpsTrail intake is returning server errors'}
